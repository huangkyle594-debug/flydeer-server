spring:
  application:
    name: flydeer-server-task
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:flydeer}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:flydeer}
    password: ${MYSQL_PASSWORD:flydeer}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  docker:
    compose:
      enabled: false
      lifecycle-management: start-and-stop
      skip:
        in-tests: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.flydeer.structmind.repository.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

server:
  port: ${TASK_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.flydeer.structmind: DEBUG

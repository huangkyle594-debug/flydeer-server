# Required env placeholders from application.yml (no defaults in main config)
MYSQL_HOST: localhost
MYSQL_PORT: 3306
MYSQL_DATABASE: flydeer
MYSQL_USER: flydeer
MYSQL_PASSWORD: flydeer
REDIS_HOST: localhost
REDIS_PORT: 6379
REDIS_PASSWORD: ""
TASK_SERVER_PORT: 0

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:struct_mind_task;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  docker:
    compose:
      enabled: false

pagehelper:
  helper-dialect: h2

logging:
  level:
    root: WARN
    com.flydeer: INFO

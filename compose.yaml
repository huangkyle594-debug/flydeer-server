services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: flydeer-struct-mind-mysql
    environment:
      MYSQL_DATABASE: struct_mind
      MYSQL_USER: struct_mind
      MYSQL_PASSWORD: struct_mind
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: docker.m.daocloud.io/library/redis:7
    container_name: flydeer-struct-mind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mysql_data:

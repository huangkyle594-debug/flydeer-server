services:
  mysql:
    image: mysql:8.4
    container_name: flydeer-struct-mind-mysql
    environment:
      MYSQL_DATABASE: struct_mind
      MYSQL_USER: struct_mind
      MYSQL_PASSWORD: struct_mind
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

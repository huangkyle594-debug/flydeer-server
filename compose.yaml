services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: flydeer-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./doc/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: docker.m.daocloud.io/library/redis:7
    container_name: flydeer-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flydeer-controller:local
    container_name: flydeer-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 加载项目根目录 .env；下面 environment 覆盖为 Compose 内网地址
    env_file:
      - path: .env
        required: true
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:$${SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql_data:
  redis_data:

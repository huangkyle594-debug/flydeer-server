services:
  mysql:
    image: docker.1ms.run/library/mysql:8.4
    container_name: flydeer-mysql
    environment:
      MYSQL_DATABASE: flydeer
      MYSQL_USER: flydeer
      MYSQL_PASSWORD: flydeer
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./doc/sql/02-user-service.sql:/docker-entrypoint-initdb.d/02-user-service.sql:ro
      - ./doc/sql/03-atlas.sql:/docker-entrypoint-initdb.d/03-atlas.sql:ro
      - ./doc/sql/migrations/001_user_info_phone_hash.sql:/docker-entrypoint-initdb.d/04-user-info-phone-hash.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: docker.1ms.run/library/postgres:16
    container_name: flydeer-postgres
    environment:
      POSTGRES_DB: flydeer_graph
      POSTGRES_USER: flydeer
      POSTGRES_PASSWORD: flydeer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./doc/sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flydeer -d flydeer_graph"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: docker.1ms.run/library/redis:7
    container_name: flydeer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
    image: flydeer-controller:local
    container_name: flydeer-app
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql_data:
  postgres_data:
  redis_data:

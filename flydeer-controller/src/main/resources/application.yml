spring:
  application:
    name: flydeer-server
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://localhost:3306/flydeer?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: flydeer
    password: flydeer
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
  docker:
    compose:
      enabled: false
      lifecycle-management: start-and-stop
      skip:
        in-tests: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.flydeer.repository.mysql.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 5MB
    max-swallow-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.flydeer: DEBUG

app:
  jwt:
    secret: change-me-to-a-long-random-secret-key!!
    access-token-ttl: 2h
    refresh-token-ttl: 90d
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: false
    refresh-cookie-path: /api/v1/auth
    redirect-url: http://localhost:5173/oauth/callback
  id:
    start: 10000000
    step-min: 1
    step-max: 99
  sms:
    mock-enabled: true
    access-key-id:
    access-key-secret:
    sign-name:
    template-code:
    region: cn-shanghai
    endpoint: dypnsapi.aliyuncs.com
    country-code: "86"
  user:
    phone-hash-salt: change-me-phone-hash-salt!!
    admin-ids: []
    ratelimit:
      sms-interval: 60s
      sms-daily-limit-per-phone: 20
      sms-daily-limit-per-ip: 50
      login-interval: 1s
  oauth:
    secret: change-me-oauth-state-hmac-secret!!
    timeout: 600000
    oauth:
      gitee:
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/api/v1/auth/gitee/callback
        authorize-url: https://gitee.com/oauth/authorize
        token-url: https://gitee.com/oauth/token
        user-url: https://gitee.com/api/v5/user
        scope: user_info
      github:
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/api/v1/auth/github/callback
        authorize-url: https://github.com/login/oauth/authorize
        token-url: https://github.com/login/oauth/access_token
        user-url: https://api.github.com/user
        scope: read:user

  common:
    notice: "网站建设中，个人备案无法提供用户登录功能，登陆组件仅为演示"

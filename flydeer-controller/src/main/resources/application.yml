spring:
  application:
    name: flydeer-server
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  docker:
    compose:
      enabled: false
      lifecycle-management: start-and-stop
      skip:
        in-tests: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.flydeer.repository.mysql.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.flydeer: DEBUG

app:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    access-token-ttl: ${AUTH_ACCESS_TTL}
    refresh-token-ttl: ${AUTH_REFRESH_TTL}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE}
    refresh-cookie-path: ${AUTH_REFRESH_COOKIE_PATH}
    redirect-url: ${AUTH_FRONTEND_REDIRECT}
  id:
    start: ${ID_START}
    step-min: ${ID_STEP_MIN}
    step-max: ${ID_STEP_MAX}
  sms:
    mock-enabled: ${SMS_MOCK_ENABLED}
    access-key-id: ${SMS_ACCESS_KEY_ID}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET}
    sign-name: ${SMS_SIGN_NAME}
    template-code: ${SMS_TEMPLATE_CODE}
    region: ${SMS_REGION}
    endpoint: ${SMS_ENDPOINT}
    country-code: ${SMS_COUNTRY_CODE}
  user:
    ratelimit:
      sms-interval: ${SMS_INTERVAL}
      sms-daily-limit-per-phone: ${SMS_DAILY_PHONE}
      sms-daily-limit-per-ip: ${SMS_DAILY_IP}
      login-interval: ${LOGIN_INTERVAL}
  oauth:
    secret: ${OAUTH_STATE_SECRET}
    timeout: ${OAUTH_STATE_TIMEOUT_MS}
    oauth:
      gitee:
        client-id: ${OAUTH_GITEE_CLIENT_ID}
        client-secret: ${OAUTH_GITEE_CLIENT_SECRET}
        redirect-uri: ${OAUTH_GITEE_REDIRECT_URI}
        authorize-url: ${OAUTH_GITEE_AUTHORIZE_URL}
        token-url: ${OAUTH_GITEE_TOKEN_URL}
        user-url: ${OAUTH_GITEE_USER_URL}
        scope: ${OAUTH_GITEE_SCOPE}
      github:
        client-id: ${OAUTH_GITHUB_CLIENT_ID}
        client-secret: ${OAUTH_GITHUB_CLIENT_SECRET}
        redirect-uri: ${OAUTH_GITHUB_REDIRECT_URI}
        authorize-url: ${OAUTH_GITHUB_AUTHORIZE_URL}
        token-url: ${OAUTH_GITHUB_TOKEN_URL}
        user-url: ${OAUTH_GITHUB_USER_URL}
        scope: ${OAUTH_GITHUB_SCOPE}

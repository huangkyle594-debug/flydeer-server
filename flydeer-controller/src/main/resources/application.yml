spring:
  application:
    name: flydeer-server
  profiles:
    default: dev
  datasource:
    mysql:
      url: jdbc:mysql://localhost:3306/flydeer?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      username: flydeer
      password: flydeer
      driver-class-name: com.mysql.cj.jdbc.Driver
    postgres:
      url: jdbc:postgresql://localhost:5432/flydeer_graph
      username: flydeer
      password: flydeer
      driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
  docker:
    compose:
      enabled: false
      lifecycle-management: start-and-stop
      skip:
        in-tests: true

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.flydeer: DEBUG

app:
  jwt:
    secret: change-me-to-a-long-random-secret-key!!
    access-token-ttl: 2h
    refresh-token-ttl: 90d
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: false
    refresh-cookie-path: /api/v1/auth
    redirect-url: http://localhost:5173/oauth/callback
  id:
    start: 10000000
    step-min: 1
    step-max: 99
  sms:
    mock-enabled: true
    access-key-id:
    access-key-secret:
    sign-name:
    template-code:
    region: cn-shanghai
    endpoint: dypnsapi.aliyuncs.com
    country-code: "86"
  user:
    phone-hash-salt: change-me-phone-hash-salt!!
    admin-ids: [ ]
    ratelimit:
      sms-interval: 60s
      sms-daily-limit-per-phone: 20
      sms-daily-limit-per-ip: 50
      login-interval: 1s
  oauth:
    secret: change-me-oauth-state-hmac-secret!!
    timeout: 600000
    oauth:
      gitee:
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/api/v1/auth/gitee/callback
        authorize-url: https://gitee.com/oauth/authorize
        token-url: https://gitee.com/oauth/token
        user-url: https://gitee.com/api/v5/user
        scope: user_info
      github:
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/api/v1/auth/github/callback
        authorize-url: https://github.com/login/oauth/authorize
        token-url: https://github.com/login/oauth/access_token
        user-url: https://api.github.com/user
        scope: read:user

  common:
    notice: "网站建设中，个人备案无法提供用户登录功能，登陆组件仅为演示"
  graph:
    max-content-bytes: 2097152
    max-batch-bytes: 8388608
    max-list-content-bytes: 20971520
    max-batch-size: 20
    max-parent-chain-depth: 100
  atlas:
    tags:
      - 流程
      - 系统
      - 架构
      - 鉴权
      - 入门
      - 进阶
      - 计算机
      - 调试
      - 机器学习
      - Web
      - 运维
      - 数据库
      - 网络
      - 安全

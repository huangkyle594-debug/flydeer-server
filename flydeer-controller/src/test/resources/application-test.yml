spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    mysql:
      url: jdbc:h2:mem:struct_mind;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
      username: sa
      password:
      driver-class-name: org.h2.Driver
    postgres:
      url: jdbc:h2:mem:struct_mind_graph;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
      username: sa
      password:
      driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-user.sql
  docker:
    compose:
      enabled: false

server:
  port: 0

pagehelper:
  helper-dialect: h2

logging:
  level:
    root: WARN
    com.flydeer: INFO

app:
  jwt:
    secret: test-jwt-secret-key-at-least-32-bytes!!
  user:
    phone-hash-salt: test-phone-hash-salt!!
  oauth:
    secret: test-oauth-state-hmac-secret!!
    oauth:
      gitee:
        client-id: test-gitee-client-id
        client-secret: test-gitee-client-secret
      github:
        client-id: test-github-client-id
        client-secret: test-github-client-secret
  atlas:
    preset-tags:
      - 流程
      - 系统
      - 架构
      - 鉴权
      - 入门
      - 进阶
      - 计算机
      - 调试
      - 机器学习
      - Web
      - 运维
      - 数据库
      - 网络
      - 安全
